name: Generate Snake Animation

on:
  # Roda automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Roda sempre que você der push na branch main
  push:
    branches:
      - main

# Permissão necessária para a Action escrever na branch "output"
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar o SVG da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: EmilyPereiraRibeiroAcad
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=ff79c6

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
